modLoader = "javafml"
loaderVersion = "[4,)"
license = "${license}"
issueTrackerURL = "${issues}"

[[mods]]
modId = "${modId}"
version = "${version}"
displayName = "${modName}"
description = '''${modDescription}'''
authors = "${members}"
displayURL = "${homepage}"
logoFile = "assets/antique_atlas/icon.png"

[[mixins]]
config = "antique_atlas.mixins.json"

[[mixins]]
config = "${modId}.mixins.json"

[[dependencies.${ modId }]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${ modId }]]
modId = "minecraft"
type = "required"
versionRange = "${mc}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${ modId }]]
modId = "rosetta_library"
type = "required"
versionRange = "[${rosetta},)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${ modId }]]
modId = "rosetta_networking"
type = "required"
versionRange = "[${rosettaNetworking},)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${ modId }]]
modId = "syrup_library"
type = "required"
versionRange = "[${syrupLibrary},)"
ordering = "AFTER"
side = "BOTH"
